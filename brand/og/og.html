<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heliora link preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #050508; overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; }
  .scene { position: absolute; inset: 0; background: url("scene.png") no-repeat; background-size: 1200px 630px; background-position: 230px 0; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #050508 0%, #050508 34%, rgba(5,5,8,0.75) 50%, rgba(5,5,8,0) 66%); }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 330px; height: auto; margin-bottom: 44px; }
  h1 { white-space: nowrap; font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 48px; line-height: 1.08; letter-spacing: -0.5px; color: #f0f0f5; margin: 0 0 22px; }
  p { font-family: Inter, sans-serif; font-size: 21px; line-height: 1.45; color: #a8a8bc; margin: 0; }
  .url { color: #ffb347; font-weight: 500; }
  .credit { position: absolute; left: 72px; bottom: 26px; font-family: Inter, sans-serif; font-size: 13px; color: #5e5e72; }
</style>
</head>
<body>
  <div class="card">
    <div class="scene"></div>
    <div class="shade"></div>
    <div class="copy">
      <img class="logo" src="../logo/heliora-horizontal-dark.svg" alt="Heliora">
      <h1>See where every planet<br>is right now, in 3D.</h1>
      <p>Live positions from NASA JPL orbital data,<br>in your browser. <span class="url">heliora.vercel.app</span></p>
    </div>
    <div class="credit">Planet textures © Solar System Scope, CC BY 4.0</div>
  </div>
</body>
</html>
